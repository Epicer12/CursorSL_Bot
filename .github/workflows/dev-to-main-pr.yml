name: Auto PR Dev to Main

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Pull Request
        uses: repo-sync/pull-request@v2
        with:
          source_branch: "dev"
          destination_branch: "main"
          pr_title: "🚀 Release candidates: Merge dev to main"
          pr_body: "This is an automated Pull Request to merge approved features from `dev` into the `main` production branch. Review the changes before merging."
          github_token: ${{ secrets.GITHUB_TOKEN }}
